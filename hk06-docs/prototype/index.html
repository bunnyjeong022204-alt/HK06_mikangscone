<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>책갈피 메모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 바탕화면 가장자리에 키워드 책갈피가 붙어 있고, 누르면 메모지가 옆으로 펼쳐진다 */
  --ink:#3a3430; --ink-soft:#7d746a; --paper:#fcf8ee; --glass:rgba(255,253,248,.82);
  --cherry:#d93a35; --sky:#a9d3ee; --line:rgba(58,52,48,.14);
  --f-display:'Jua','Gowun Dodum',sans-serif;
  --f-hand:'Gaegu','Gowun Dodum',cursive;
  --f-ui:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f-ui);color:var(--ink);background:#cdd9e6;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}
svg{display:block}

/* ───── 바탕화면 ───── */
.stage{position:relative;height:100%;overflow:hidden;
  background:
   radial-gradient(900px 600px at 10% 6%,#f6dfd8 0,transparent 60%),
   radial-gradient(800px 700px at 90% 92%,#cfe1ef 0,transparent 60%),
   linear-gradient(160deg,#c8d6e8,#ddd6e8 55%,#ecdcd3)}
.menubar{position:absolute;inset:0 0 auto 0;height:32px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(255,255,255,.5);backdrop-filter:blur(10px);font-size:13px}
.menubar .l,.menubar .r{display:flex;align-items:center;gap:14px}
.menubar b{font-family:var(--f-display);font-weight:400;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.6)}
.seg button{border:0;background:transparent;padding:3px 10px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.win{position:absolute;left:5%;top:70px;width:min(58%,720px);height:62%;background:#fffdf9;border-radius:12px;box-shadow:0 18px 40px rgba(60,60,90,.18),0 0 0 1px rgba(0,0,0,.05);overflow:hidden}
.win.back{left:11%;top:120px;height:66%;opacity:.7;transform:rotate(.6deg)}
.win .tb{height:34px;display:flex;align-items:center;gap:7px;padding:0 12px;background:#f2eee6;border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-soft)}
.win .tb i{width:11px;height:11px;border-radius:50%;display:block}
.win .doc{padding:22px 30px;display:grid;gap:11px}
.win h2{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:26px}
.win p.sub{margin:0 0 8px;color:var(--ink-soft);font-size:13px}
.sk{height:10px;border-radius:5px;background:#ece7dd}
.hint{position:absolute;top:84px;z-index:12;padding:10px 14px;border-radius:14px;background:rgba(255,253,248,.92);box-shadow:0 6px 16px rgba(60,50,40,.16);font-size:13px;transition:opacity .3s}
.side-right .hint{right:196px}.side-left .hint{left:196px}
.hint.gone{opacity:0;pointer-events:none}
.stage.has-open .hint{opacity:0}

/* ───── 책갈피 ───── */
.dock{position:absolute;top:78px;bottom:20px;z-index:30;display:flex;flex-direction:column;gap:9px;padding:4px 0;overflow-y:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.side-right .dock{right:0;align-items:flex-end}
.side-left .dock{left:0;align-items:flex-start}
.tab{--tc:#fff;--ti:#333;position:relative;flex:none;display:flex;flex-direction:column;justify-content:center;gap:2px;width:max-content;min-width:96px;max-width:176px;min-height:46px;padding:8px 22px;border:0;background:var(--tc);color:var(--ti);font-family:var(--f-display);font-size:17px;line-height:1.1;text-align:left;box-shadow:0 4px 10px rgba(50,40,30,.2),inset 0 -2px 0 rgba(0,0,0,.07);transition:transform .3s cubic-bezier(.2,.9,.3,1.25)}
.tab::before{content:'';position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:rgba(255,255,255,.78);box-shadow:inset 0 1px 2px rgba(0,0,0,.28)}
.side-right .tab{border-radius:16px 0 0 16px;transform:translateX(14px);padding-left:28px}
.side-right .tab::before{left:10px}
.side-left .tab{border-radius:0 16px 16px 0;transform:translateX(-14px);padding-right:28px}
.side-left .tab::before{right:10px}
.tab:hover,.tab:focus-visible{transform:translateX(0)}
.side-right .tab.open{transform:translateX(-8px)}
.side-left .tab.open{transform:translateX(8px)}
.tab .k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .when{display:flex;align-items:center;gap:3px;font-family:var(--f-ui);font-size:11px;opacity:.8;white-space:nowrap}
.tab.add{--tc:rgba(255,255,255,.8);--ti:#5a524a;font-size:15px;border:1.5px dashed rgba(58,52,48,.35)}
.tab.agenda{--tc:#3a3430;--ti:#fcf8ee}
.tab.ring{animation:wig .7s ease-in-out infinite}
.side-right .tab.ring{transform-origin:right center}
@keyframes wig{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(0) rotate(-4deg)}75%{transform:translateX(0) rotate(4deg)}}

/* ───── 메모지 시트 ───── */
.sheet{position:absolute;top:58px;z-index:25;width:420px;--s:1;--tx:60px;--rot:2.5deg;opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .4s cubic-bezier(.2,.9,.25,1.08),opacity .22s,visibility 0s .4s}
.side-right .sheet{right:150px;transform-origin:top right;transform:translateX(var(--tx)) rotate(var(--rot)) scale(var(--s))}
.side-left .sheet{left:150px;--tx:-60px;--rot:-2.5deg;transform-origin:top left;transform:translateX(var(--tx)) rotate(var(--rot)) scale(var(--s))}
.stage .sheet.open{--tx:0px;--rot:0deg;opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
@media (max-width:700px){.side-right .sheet{right:8px}.side-left .sheet{left:8px}.hint{display:none}}

.card{position:relative;width:420px;height:560px;filter:drop-shadow(0 14px 18px rgba(60,45,30,.24))}
.backing{position:absolute;inset:24px 16px -14px -12px;border-radius:6px;transform:rotate(var(--br,-2deg))}
.paper{position:absolute;inset:0;width:100%;height:100%}
.clip{position:absolute;top:-30px;width:130px;height:70px;z-index:4;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.content{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;gap:8px;padding:var(--pad)}
.kw{width:100%;border:0;outline:0;padding:0 4px;background:linear-gradient(transparent 64%,var(--hl) 64%);font-family:var(--f-display);font-size:40px;line-height:1.15;color:var(--ink)}
.kw::placeholder{color:rgba(58,52,48,.28)}
.ttl{border:0;outline:0;border-bottom:1px dashed var(--line);background:transparent;padding:3px 2px;font-size:14px;color:var(--ink-soft)}
.sum{background:var(--hl2);border-radius:10px;padding:7px 10px;font-size:12.5px;line-height:1.5}
.sum .sh{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);margin-bottom:2px}
.sum ul{margin:0;padding-left:16px}
.body{flex:1;min-height:70px;resize:none;border:0;outline:0;background-image:repeating-linear-gradient(to bottom,transparent 0 29px,var(--rule) 29px 30px);background-attachment:local;background-color:transparent;font-family:var(--f-hand);font-size:23px;line-height:30px;color:var(--ink);padding:0 2px}
.body::placeholder{color:rgba(58,52,48,.35)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:62px;height:62px;border-radius:4px;background:#fff;padding:3px;box-shadow:0 2px 4px rgba(0,0,0,.2);transform:rotate(var(--r,0deg))}
.ph img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}
.ph .pa{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;padding:2px}
.ph:hover .pa,.ph:focus-within .pa{display:flex}
.ph .pa button{width:22px;height:22px;border:0;border-radius:6px;background:rgba(58,52,48,.85);color:#fff;display:grid;place-items:center;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:0;padding-left:30px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:12px;line-height:1.5}
.chip button{border:0;background:transparent;padding:2px;display:grid;place-items:center;border-radius:50%;color:var(--ink-soft)}
.chip button.on{color:var(--cherry)}
.chip.off{opacity:.6}
.chip.cand{border-style:dashed;background:transparent;padding:2px 8px 2px 4px}
.chip.cand button{color:var(--ink);padding:0 2px;display:inline-flex;gap:3px;align-items:center}
.stk-layer{position:absolute;inset:0;z-index:6;pointer-events:none}
.stk{position:absolute;pointer-events:auto;touch-action:none;cursor:grab;user-select:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))}
.stk:active{cursor:grabbing}
.stk.sel{outline:2px dashed rgba(217,58,53,.75);outline-offset:4px;border-radius:6px}
.stk.photo{background:#fff;padding:5px 5px 16px;border-radius:3px}
.stk.photo img{display:block;width:100%;height:auto;pointer-events:none;border-radius:1px}
.stk svg{width:100%;height:auto;pointer-events:none}
.sbar{position:absolute;z-index:9;display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--ink);pointer-events:auto}
.sbar button{width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:#fff;display:grid;place-items:center;padding:0}
.sbar button:hover{background:rgba(255,255,255,.18)}
.orn{position:absolute;z-index:5;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))}
.orn svg{width:100%;height:auto}
.card.drop::after{content:'사진을 놓으면 붙어요';position:absolute;inset:8px;z-index:9;display:grid;place-items:center;border:3px dashed var(--cherry);border-radius:22px;background:rgba(255,253,248,.7);font-family:var(--f-display);font-size:22px;color:var(--cherry);pointer-events:none}

.bar{position:relative;margin-top:14px;width:420px;padding:9px 10px;border-radius:16px;background:var(--glass);backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(60,50,40,.16);display:grid;gap:8px}
.bar .row{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.9);font-size:13.5px;white-space:nowrap}
.btn:hover{background:#fff}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary[disabled]{opacity:.7;cursor:progress}
.btn.icon{padding:7px 8px}
.btn.grow{margin-left:auto}
.fold svg{transition:transform .2s}
.side-left .fold svg{transform:scaleX(-1)}
.lbl{font-size:12px;color:var(--ink-soft)}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.del.armed{background:var(--cherry);color:#fff;border-color:var(--cherry)}
.pal{position:absolute;left:10px;right:10px;bottom:calc(100% + 8px);z-index:12;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px;border-radius:14px;background:#fffdf8;box-shadow:0 10px 24px rgba(60,50,40,.25)}
.pal[hidden]{display:none}
.pal button{border:0;background:transparent;border-radius:10px;padding:6px;display:grid;place-items:center;height:54px}
.pal button:hover{background:rgba(217,58,53,.1)}
.pal svg{width:40px;height:auto;max-height:40px}

/* ───── 일정 정리 ───── */
.acard{position:relative;width:420px;height:560px;border-radius:26px;background:var(--paper);box-shadow:0 14px 18px rgba(60,45,30,.2);display:flex;flex-direction:column;padding:44px 26px 20px}
.acard::before{content:'';position:absolute;inset:10px;border:1.8px dashed rgba(58,52,48,.25);border-radius:18px;pointer-events:none}
.acard .clip{left:40%}
.ahead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ahead h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;background:linear-gradient(transparent 64%,rgba(169,211,238,.7) 64%);padding:0 4px}
.ahead .btn{padding:5px 8px}
.brief{margin:10px 0 6px;padding:9px 12px;border-radius:12px;background:rgba(169,211,238,.3);font-size:13px;line-height:1.55}
.brief .sh{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);margin-bottom:2px}
.alist{flex:1;overflow:auto;padding-right:4px;display:grid;align-content:start;gap:4px}
.gh{margin:10px 0 2px;font-size:12px;color:var(--ink-soft);letter-spacing:.02em}
.arow{display:flex;gap:9px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--line)}
.arow .ck{flex:none;width:22px;height:22px;margin-top:2px;border-radius:7px;border:1.8px solid var(--ink-soft);background:#fff;display:grid;place-items:center;padding:0;color:transparent}
.arow.done .ck{background:var(--ink);border-color:var(--ink);color:#fff}
.arow.done .at{text-decoration:line-through;opacity:.55}
.arow .ab{min-width:0;flex:1}
.arow .at{display:block;max-width:100%;border:0;background:transparent;padding:0;text-align:left;font-family:var(--f-hand);font-size:20px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .am{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px;font-size:12px;color:var(--ink-soft)}
.kwchip{padding:1px 8px;border-radius:99px;font-family:var(--f-display);font-size:12px}
.rep{border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px;padding:1px 4px}
.ib{border:0;background:transparent;padding:3px;border-radius:6px;display:grid;place-items:center;color:var(--ink-soft)}
.ib.on{color:var(--cherry)}
.empty{padding:26px 8px;text-align:center;color:var(--ink-soft);font-size:13px}
.afoot{display:flex;gap:6px;padding-top:10px;flex-wrap:wrap}

/* ───── 알람 토스트 ───── */
.toasts{position:fixed;top:42px;left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:8px;width:min(380px,92vw)}
.toast{display:flex;gap:10px;padding:11px 12px;border-radius:16px;background:rgba(255,253,248,.97);box-shadow:0 12px 28px rgba(50,40,30,.28);animation:drop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.toast .bi{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.toast .tt{font-family:var(--f-display);font-size:16px}
.toast .tb2{font-size:13px;color:var(--ink-soft);margin-top:1px}
.toast .ta{display:flex;gap:6px;margin-top:8px}
.toast .ta .btn{padding:4px 9px;font-size:12.5px}

@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="g-red" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#fff"/><rect width="4" height="8" fill="#d93a35" opacity=".85"/><rect width="8" height="4" fill="#d93a35" opacity=".85"/></pattern>
</defs></svg>

<div class="stage side-right" id="stage">
  <div class="menubar">
    <div class="l"><b>책갈피 메모</b><span style="color:var(--ink-soft)">바탕화면 미리보기</span></div>
    <div class="r">
      <span class="lbl">책갈피 위치</span>
      <div class="seg" role="group" aria-label="책갈피 위치">
        <button type="button" id="sideL" aria-pressed="false">왼쪽</button>
        <button type="button" id="sideR" aria-pressed="true">오른쪽</button>
      </div>
      <span id="clock">--</span>
    </div>
  </div>

  <div class="win back"><div class="tb"><i style="background:#e8b7b0"></i><i style="background:#e8d9a5"></i><i style="background:#b8d6b4"></i>&nbsp;참고 자료.pdf</div></div>
  <div class="win" id="win">
    <div class="tb"><i style="background:#ef9a93"></i><i style="background:#efd37f"></i><i style="background:#9fcf98"></i>&nbsp;팀 프로젝트 기획서.docx</div>
    <div class="doc">
      <h2>팀 프로젝트 기획서</h2>
      <p class="sub">작업 중인 문서입니다. 메모지는 화면 가장자리에 접혀 있어서 작업 화면을 가리지 않아요.</p>
      <div class="sk" style="width:92%"></div><div class="sk" style="width:78%"></div><div class="sk" style="width:86%"></div>
      <div class="sk" style="width:40%;margin-top:10px;height:14px;background:#e3ddd0"></div>
      <div class="sk" style="width:90%"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:82%"></div><div class="sk" style="width:55%"></div>
    </div>
  </div>

  <div class="hint" id="hint"></div>
  <nav class="dock" id="dock" aria-label="메모 책갈피"></nav>
  <section class="sheet" id="sheet" role="dialog" aria-label="메모지"></section>
  <section class="sheet" id="agenda" role="dialog" aria-label="일정 정리"></section>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<script>
(()=>{
'use strict';
/* ─────────── 도우미 ─────────── */
const $=(s,r=document)=>r.querySelector(s);
const h=(tag,attrs={},...kids)=>{
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else if(k==='style')el.style.cssText=v;
    else if(k==='value')el.value=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat()){if(kid==null||kid===false)continue;el.append(kid.nodeType?kid:document.createTextNode(kid))}
  return el;
};
const ICONS={
  image:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/>',
  star:'<path d="M12 3.5l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.8l6-.8z"/>',
  sparkle:'<path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  bell:'<path d="M6 17h12l-1.5-2v-5a4.5 4.5 0 0 0-9 0v5z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  minus:'<path d="M5 12h14"/>',
  rotate:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  fold:'<path d="M9 5l7 7-7 7"/>',
};
const ico=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const iel=(n,s=18)=>h('span',{html:ico(n,s),style:'display:inline-grid;place-items:center'});
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

const DAYMS=86400000, WD=['일','월','화','수','목','금','토'];
const pad=n=>String(n).padStart(2,'0');
const startOfDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmtTime=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function fmtWhen(at){
  const d=new Date(at),diff=Math.round((startOfDay(d)-startOfDay(new Date()))/DAYMS),t=fmtTime(d);
  if(diff===0)return '오늘 '+t; if(diff===1)return '내일 '+t; if(diff===-1)return '어제 '+t;

function scallop(W,H,m=12,d=22){
  const x0=m,y0=m,w=W-2*m,hh=H-2*m,nx=Math.round(w/d),ny=Math.round(hh/d),dx=w/nx,dy=hh/ny;
  let p=`M${x0} ${y0}`;
  for(let i=1;i<=nx;i++)p+=`A${dx/2} ${dx/2} 0 0 1 ${x0+i*dx} ${y0}`;
  for(let i=1;i<=ny;i++)p+=`A${dy/2} ${dy/2} 0 0 1 ${x0+w} ${y0+i*dy}`;
  for(let i=1;i<=nx;i++)p+=`A${dx/2} ${dx/2} 0 0 1 ${x0+w-i*dx} ${y0+hh}`;
  for(let i=1;i<=ny;i++)p+=`A${dy/2} ${dy/2} 0 0 1 ${x0} ${y0+hh-i*dy}`;
  return p+'Z';
}
function notebookPath(W,H){
  const x0=16,y0=16,w=W-32,hh=H-32,r=8;let p=`M${x0+r} ${y0}H${x0+w-r}Q${x0+w} ${y0} ${x0+w} ${y0+r}V${y0+hh-r}Q${x0+w} ${y0+hh} ${x0+w-r} ${y0+hh}H${x0+r}Q${x0} ${y0+hh} ${x0} ${y0+hh-r}`;
  const ys=[];for(let i=0;i<10;i++)ys.push(70+i*(hh-110)/9);
  for(const y of ys.reverse())p+=`V${y+8}A8 8 0 0 0 ${x0} ${y-8}`;
  return p+`V${y0+r}Q${x0} ${y0} ${x0+r} ${y0}Z`;
}

/* ─────────── 간이 분석 (AI 연결이 없을 때의 기본 규칙) ─────────── */
const KWDICT=[['회의','회의'],['미팅','미팅'],['발표','발표'],['마감','마감'],['제출','제출'],['시험','시험'],['면접','면접'],['병원','병원'],['약속','약속'],['생일','생일'],['장보기','장보기'],['마트','장보기'],['사야','장보기'],['공부','공부'],['과제','과제'],['운동','운동'],['여행','여행'],['예약','예약'],['결제','결제'],['택배','택배'],['청소','청소'],['아이디어','아이디어'],['비밀번호','비밀번호']];
const PARTICLE=/(으로|에서|에게|까지|부터|하기|들|을|를|은|는|이|가|에|의|도|만|로|와|과)$/;
function stripBullet(l){return l.replace(/^\s*(?:[-–•·*]|\d+[.)])\s+/,'').trim()}
function guessKeyword(text,title){
  const all=(title?title+'\n':'')+text;
  for(const [k,v] of KWDICT)if(all.includes(k))return v;
  const src=(title||all).split(/\n/)[0].trim();
  const tok=(src.split(/[\s,/]+/).filter(Boolean)[0]||'').replace(PARTICLE,'');
  return (tok||'메모').slice(0,6);
}
function summarize(text){
  let lines=text.split(/\n+/).map(stripBullet).filter(Boolean);
  if(lines.length===1&&lines[0].length>40)lines=lines[0].split(/[.!?]\s+/).filter(Boolean);
  return lines.slice(0,3).map(l=>l.length>32?l.slice(0,31)+'…':l);
}
const PARTS=new Set(['에','까지','부터','쯤','정도','에는','엔','마다']);
function parseEvents(text,now=new Date()){
  const out=[],today=startOfDay(now);
  const lines=text.split(/\n+/).flatMap(l=>l.split(/[.!?]\s+/)).map(stripBullet).filter(Boolean);
  for(const line of lines){
    let d=null,rolling=false,mm;
    if(/모레/.test(line))d=addDays(today,2);
    else if(/내일/.test(line))d=addDays(today,1);
    else if(/오늘/.test(line))d=today;
    else if((mm=line.match(/(다음\s*주|담주|이번\s*주)?\s*([일월화수목금토])요일/))){
      const t=WD.indexOf(mm[2]),pre=mm[1]||'';
      if(pre){const mon=addDays(today,-((today.getDay()+6)%7));d=addDays(mon,(t+6)%7+(/다음|담/.test(pre)?7:0))}
      else{d=addDays(today,(t-today.getDay()+7)%7);rolling=true}
    }
    else if((mm=line.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/))){d=new Date(now.getFullYear(),+mm[1]-1,+mm[2]);if(d<today)d.setFullYear(d.getFullYear()+1)}
    else if((mm=line.match(/(?:^|[^\d])(\d{1,2})\/(\d{1,2})(?!\d)/))){d=new Date(now.getFullYear(),+mm[1]-1,+mm[2]);if(d<today)d.setFullYear(d.getFullYear()+1)}
    let hr=null,mi=0;
    const tm=line.match(/(오전|오후|아침|저녁|점심|밤|새벽)?\s*(\d{1,2})\s*시(?!간)(?:\s*(\d{1,2})\s*분|\s*(반))?/);
    const tc=!tm&&line.match(/(?:^|[^\d])(\d{1,2}):(\d{2})(?!\d)/);
    if(tm){
      const mer=tm[1];hr=+tm[2];mi=tm[3]?+tm[3]:tm[4]?30:0;
      if(mer&&/오후|저녁|밤/.test(mer)&&hr<12)hr+=12;
      else if(mer&&/오전|아침|새벽/.test(mer)&&hr===12)hr=0;
      else if(mer==='점심'&&hr<=5)hr+=12;
      else if(!mer&&hr>=1&&hr<=6)hr+=12;
    }else if(tc){hr=+tc[1];mi=+tc[2]}
    else if(d&&(mm=line.match(/아침|점심|저녁|밤|새벽/)))hr={아침:8,점심:12,저녁:18,밤:21,새벽:6}[mm[0]];
    if(!d&&hr==null)continue;
    if(hr!=null&&(hr>23||mi>59))continue;
    let at=d?new Date(d):new Date(today);
    at.setHours(hr==null?9:hr,mi,0,0);
    if(!d&&at<now)at=addDays(at,1);
    else if(rolling&&at<now)at=addDays(at,7);
    if(at<now-60000)continue;
    const title=line
      .replace(/모레|내일|오늘|(다음\s*주|담주|이번\s*주)?\s*[일월화수목금토]요일|\d{1,2}\s*월\s*\d{1,2}\s*일|\d{1,2}\/\d{1,2}|(오전|오후|아침|저녁|점심|밤|새벽)?\s*\d{1,2}\s*시(?!간)(\s*\d{1,2}\s*분|\s*반)?|\d{1,2}:\d{2}/g,' ')
      .split(/\s+/).filter(t=>t&&!PARTS.has(t)).join(' ').replace(/^[\s,·:\-–]+|[\s,·:\-–]+$/g,'').slice(0,26)||'일정';
    out.push({title,at:at.getTime(),repeat:'none'});
  }
  return out;
}
function localAnalyze(text,title){return {keyword:guessKeyword(text,title),summary:summarize(text),events:parseEvents((title?title+'\n':'')+text),src:'local'}}

/* ─────────── 일정 · 알람 ─────────── */
function mkEvent(ev){return {id:uid(),title:ev.title,at:ev.at,repeat:ev.repeat||'none',alarm:true,done:false,fired:false}}
function addEvent(n,ev){
  if(n.events.some(e=>Math.abs(e.at-ev.at)<60000&&e.title===ev.title))return false;
  n.events.push(mkEvent(ev));n.events.sort((a,b)=>a.at-b.at);return true;
}
function nextEvent(n){
  const now=Date.now();let best=null;
  for(const e of n.events)if(e.alarm&&!e.done&&!e.fired&&e.at>=now-60000&&(!best||e.at<best.at))best=e;
  return best;
}
function candidates(n){
  const have=n.events;
  return parseEvents([n.title,n.text].filter(Boolean).join('\n')).filter(c=>!have.some(e=>Math.abs(e.at-c.at)<60000));
}
function chime(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)(),t=ac.currentTime;
    [880,1175].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),s=t+i*.18;
      o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.12,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.6);
      o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+.65)});
  }catch(e){}
}
function toast({title,body,theme,actions=[],ttl=0}){
  const box=$('#toasts'),t=TH(theme||'cherry').tab;
  const el=h('div',{class:'toast',role:'status'},
    h('div',{class:'bi',style:`background:${t.bg};color:${t.ink}`,html:ico('bell',20)}),
    h('div',{style:'flex:1;min-width:0'},
      h('div',{class:'tt'},title),body?h('div',{class:'tb2'},body):null,
      actions.length?h('div',{class:'ta'},actions.map(a=>h('button',{class:'btn'+(a.primary?' primary':''),type:'button',onclick:()=>{el.remove();a.run&&a.run()}},a.label))):null));
  box.append(el);
  if(ttl)setTimeout(()=>el.remove(),ttl);
  return el;
}
function fire(n,e){
  const info={title:e.title,at:e.at,repeat:e.repeat};
  e.fired=true;
  if(e.repeat&&e.repeat!=='none'){
    const step=e.repeat==='daily'?DAYMS:7*DAYMS;let nat=e.at+step;while(nat<=Date.now())nat+=step;e.at=nat;e.fired=false;
  }
  n.ring=true;chime();
  toast({title:`${n.keyword||'메모'} · ${info.title}`,body:`${fmtTime(new Date(info.at))} 일정이에요.`,theme:n.theme,actions:[
    {label:'메모 열기',primary:true,run:()=>{openNote(n.id)}},
    {label:'10분 뒤 다시',run:()=>{n.ring=false;
      if(info.repeat==='none'){e.at=Date.now()+600000;e.fired=false}else addEvent(n,{title:info.title,at:Date.now()+600000});
      save();renderTabs();refreshAgenda()}},
    {label:'확인',run:()=>{n.ring=false;save();renderTabs()}},
  ]});
}
function tick(){
  const now=Date.now();let dirty=false;
  for(const n of S.notes)for(const e of n.events){
    if(!e.alarm||e.done||e.fired||e.at>now)continue;
    if(now-e.at>6*3600000){e.fired=true;e.missed=true;dirty=true;continue}
    fire(n,e);dirty=true;
  }
  if(dirty){save();renderTabs();refreshAgenda()}
  updateClock();

/* ─────────── 열기 · 닫기 ─────────── */
function commitCurrent(){
  const n=openId&&byId(openId);if(!n)return;
  if(isEmpty(n)){S.notes=S.notes.filter(x=>x!==n);return}
  if(!n.keyword.trim()&&(n.text.trim()||n.title.trim()))n.keyword=guessKeyword(n.text,n.title);
  if(!n.summary.length&&n.text.trim())n.summary=summarize(n.text);
}
function closeAll(){

  renderTabs();save();
}
function toggleNote(id){if(openId===id)closeAll();else openNote(id)}
function openNote(id){
  const n=byId(id);if(!n)return;

/* ─────────── 사진 · 스티커 ─────────── */
function readPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const k=Math.min(1,640/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('read'))};
    img.src=url;
  });
}
async function addPhotos(n,files){
  let added=0;
  for(const f of files){
    if(n.photos.length>=4){toast({title:'사진은 메모 하나에 4장까지 붙일 수 있어요',ttl:2600});break}
    try{n.photos.push(await readPhoto(f));added++}catch(e){toast({title:'사진을 읽지 못했어요',body:'다른 이미지 파일로 다시 시도해 주세요.',ttl:3000})}

function sizeOf(st){return st.type==='photo'?132*st.s:STK[st.type].w*st.s}

function place(el,st){

  el.style.transform=`translate(-50%,-50%) rotate(${st.rot}deg)`;
}
function placeBar(bar,st,el){

  bar.style.top=clamp(st.y-hh/2-48,2,520)+'px';
}
function bindDrag(el,n,st){
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const was=selStk===st.id;selStk=st.id;
    const card=el.closest('.card'),sc=card.getBoundingClientRect().width/420;
    const sx=e.clientX,sy=e.clientY,ox=st.x,oy=st.y;let moved=false;
    el.setPointerCapture(e.pointerId);
    document.querySelectorAll('.stk.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');
    const mv=ev=>{
      moved=true;st.x=clamp(ox+(ev.clientX-sx)/sc,-10,430);st.y=clamp(oy+(ev.clientY-sy)/sc,-10,570);place(el,st);
      const b=card.querySelector('.sbar');if(b)placeBar(b,st,el);
    };
    const up=()=>{
      el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
      save();if(!was||!moved)renderStickers(n);
    };
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
}

/* ─────────── AI 비서 ─────────── */
function normalizeAI(j){
  if(!j||typeof j!=='object')return null;
  const keyword=String(j.keyword||'').trim().slice(0,8);
  const summary=(Array.isArray(j.summary)?j.summary:[]).map(s=>String(s).trim().slice(0,40)).filter(Boolean).slice(0,3);
  const events=[];
  for(const e of (Array.isArray(j.events)?j.events:[])){
    const at=new Date(String(e.when||'')).getTime();
    if(!isFinite(at))continue;
    events.push({title:String(e.title||'일정').trim().slice(0,26)||'일정',at,repeat:['daily','weekly'].includes(e.repeat)?e.repeat:'none'});
  }
  return keyword?{keyword,summary,events,src:'claude'}:null;
}
async function runAI(n){
  const text=[n.title,n.text].filter(Boolean).join('\n');
  if(!text.trim()){toast({title:'메모를 먼저 적어주세요',body:'적은 내용을 읽고 키워드와 일정을 정리해요.',ttl:2800});return}
  const btn=$('#aiBtn');btn.disabled=true;btn.replaceChildren(iel('sparkle',16),'정리하는 중…');
  let r=null;
  try{
    const sample=await (window.claude&&window.claude.use?window.claude.use('sample'):null);
    if(sample){
      const now=new Date(),iso=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${fmtTime(now)}`;
      const prompt=`너는 바탕화면 메모 앱의 AI 비서야. 아래 메모를 읽고 JSON 하나만 출력해. 설명과 코드블록은 쓰지 마.
형식: {"keyword":"핵심 키워드 1개 (한글 2~6자 명사)","summary":["요점","요점"],"events":[{"title":"할 일 (20자 이내)","when":"YYYY-MM-DDTHH:mm","repeat":"none|daily|weekly"}]}
규칙: summary는 최대 3개, 각 30자 이내. events에는 날짜나 시간이 있는 일만 넣고, 시간이 없으면 09:00으로 해. 내일, 금요일 같은 표현은 현재 시각 기준 미래 날짜로 계산해. 일정이 없으면 events는 빈 배열.
현재 시각: ${iso} (${WD[now.getDay()]}요일)
메모:
"""
${text}
"""`;
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),40000);
      try{const out=await sample(prompt,{modelTier:'quick',cache:false,signal:ctl.signal});const m=String(out&&out.text||'').match(/\{[\s\S]*\}/);if(m)r=normalizeAI(JSON.parse(m[0]))}
      finally{clearTimeout(to)}
    }
  }catch(e){r=null}
  if(!r)r=localAnalyze(n.text,n.title);
  n.keyword=r.keyword;n.kwManual=false;n.summary=r.summary;n.aiSource=r.src;
  let added=0;for(const ev of r.events)if(ev.at>Date.now()-60000&&addEvent(n,ev))added++;
  save();
  if(openId===n.id)renderCard(n);
  renderTabs();refreshAgenda();
  toast({title:`'${n.keyword}' 키워드로 정리했어요`,body:added?`일정 ${added}개에 알람을 맞췄어요.`:'새로 찾은 일정은 없어요.',theme:n.theme,ttl:3200});
}

/* ─────────── 일정 정리 화면 ─────────── */
function briefing(){
  const now=Date.now(),t0=startOfDay(new Date()).getTime(),all=[];
  S.notes.forEach(n=>n.events.forEach(e=>all.push({n,e})));
  const today=all.filter(x=>!x.e.done&&x.e.at>=t0&&x.e.at<t0+DAYMS).sort((a,b)=>a.e.at-b.e.at);
  const nx=all.filter(x=>!x.e.done&&x.e.alarm&&x.e.at>now).sort((a,b)=>a.e.at-b.e.at)[0];
  const a=today.length?`오늘 일정은 ${today.length}개예요. ${today.slice(0,3).map(x=>`${fmtTime(new Date(x.e.at))} ${x.e.title}`).join(', ')}${today.length>3?' 외':''}.`:'오늘 남은 일정이 없어요.';
  const b=nx?` 다음 알람은 ${fmtIn(nx.e.at-now)}, '${nx.e.title}'이에요.`:'';
  return a+b;
}
function refreshAgenda(){if(agendaOpen)renderAgenda()}
function renderAgenda(){
  const root=$('#agenda');
  const all=[];S.notes.forEach(n=>n.events.forEach(e=>all.push({n,e})));all.sort((a,b)=>a.e.at-b.e.at);
  const t0=startOfDay(new Date()).getTime();
  const groups=[['오늘',x=>x.e.at>=t0&&x.e.at<t0+DAYMS],['내일',x=>x.e.at>=t0+DAYMS&&x.e.at<t0+2*DAYMS],['앞으로',x=>x.e.at>=t0+2*DAYMS],['지난 일정',x=>x.e.at<t0]];
  const list=h('div',{class:'alist'});
  if(!all.length)list.append(h('div',{class:'empty'},'아직 일정이 없어요. 메모에 “내일 오후 3시 치과”처럼 적고 AI 정리를 누르면 여기에 모여요.'));
  for(const [name,f] of groups){
    const rows=all.filter(f);if(!rows.length)continue;
    list.append(h('div',{class:'gh'},`${name} ${rows.length}`));
    for(const {n,e} of rows){
      const t=TH(n.theme).tab;
      list.append(h('div',{class:'arow'+(e.done?' done':'')},
        h('button',{class:'ck',type:'button','aria-label':e.done?'완료 취소':'완료',onclick:()=>{e.done=!e.done;save();renderAgenda();renderTabs()},html:ico('check',14)}),
        h('div',{class:'ab'},
          h('button',{class:'at',type:'button',title:e.title,onclick:()=>openNote(n.id)},e.title),
          h('div',{class:'am'},
            h('span',{},fmtWhen(e.at)),
            h('span',{class:'kwchip',style:`background:${t.bg};color:${t.ink}`},n.keyword||'메모'),
            h('select',{class:'rep','aria-label':'반복',onchange:ev=>{e.repeat=ev.target.value;save()}},
              [['none','한 번'],['daily','매일'],['weekly','매주']].map(([v,l])=>h('option',{value:v,selected:e.repeat===v},l))),
            h('button',{class:'ib'+(e.alarm?' on':''),type:'button','aria-label':'알람 켜기/끄기',title:e.alarm?'알람 끄기':'알람 켜기',onclick:()=>{e.alarm=!e.alarm;if(e.alarm&&e.at>Date.now())e.fired=false;save();renderAgenda();renderTabs()},html:ico('bell',15)}),
            h('button',{class:'ib',type:'button','aria-label':'일정 삭제',title:'일정 삭제',onclick:()=>{n.events=n.events.filter(x=>x!==e);save();renderAgenda();renderTabs()},html:ico('trash',15)})))));
    }
  }
  const card=h('div',{class:'acard'},
    h('div',{class:'ahead'},h('h3',{},'일정 정리'),h('button',{class:'btn icon fold',type:'button','aria-label':'책갈피로 접기',onclick:closeAll,html:ico('fold',16)})),
    h('div',{class:'brief'},h('div',{class:'sh'},iel('sparkle',12),'AI 비서 브리핑'),briefing()),
    list,
    h('div',{class:'afoot'},
      h('button',{class:'btn',type:'button',onclick:rescan},iel('sparkle',15),'메모에서 일정 모두 찾기'),
      h('button',{class:'btn',type:'button',onclick:demoAlarm},iel('bell',15),'5초 뒤 알람 체험')));
  root.replaceChildren(card);
  root.querySelector('.acard').insertAdjacentHTML('afterbegin',clipSVG({c:'#cfd4da',e:'#98a1ac',metal:true}));
}
function rescan(){
  let added=0;for(const n of S.notes)for(const c of parseEvents([n.title,n.text].filter(Boolean).join('\n')))if(addEvent(n,c))added++;
  save();renderAgenda();renderTabs();
  toast({title:added?`일정 ${added}개를 새로 찾았어요`:'새로 찾은 일정이 없어요',ttl:2600});
}
function demoAlarm(){
  let n=(openId&&byId(openId))||S.notes[0];
  if(!n){n={id:uid(),theme:'cherry',title:'',text:'',keyword:'체험',kwManual:true,summary:[],events:[],photos:[],stickers:[],aiSource:'',createdAt:Date.now()};S.notes.unshift(n)}
  addEvent(n,{title:'알람 체험: 이렇게 알려드려요',at:Date.now()+5000});
  save();renderAgenda();renderTabs();
  toast({title:'5초 뒤에 알람이 울려요',body:`'${n.keyword||'메모'}' 책갈피가 흔들리면서 알려드려요.`,theme:n.theme,ttl:3000});
}

/* ─────────── 시작 ─────────── */
function applySide(){
  const left=S.side==='left';
  $('#stage').classList.toggle('side-left',left);$('#stage').classList.toggle('side-right',!left);
  $('#sideL').setAttribute('aria-pressed',String(left));$('#sideR').setAttribute('aria-pressed',String(!left));
  $('#hint').textContent=left?'← 가장자리의 키워드를 눌러보세요':'가장자리의 키워드를 눌러보세요 →';
}
$('#sideL').onclick=()=>{S.side='left';applySide();save()};
$('#sideR').onclick=()=>{S.side='right';applySide();save()};
document.addEventListener('pointerdown',e=>{
  if(!(openId||agendaOpen))return;
  if(e.target.closest('.sheet,.dock,.toasts,.menubar'))return;
  closeAll();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(openId||agendaOpen)){const p=$('.pal:not([hidden])');if(p){p.hidden=true;return}closeAll()}});
addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

S=load()||seed();
if(!S.side)S.side='left';
for(const n of S.notes){n.events=n.events||[];n.photos=n.photos||[];n.stickers=n.stickers||[];n.summary=n.summary||[];n.ring=false}
applySide();renderTabs();fit();updateClock();
tick();setInterval(tick,10000);
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){}
})();
</script>
